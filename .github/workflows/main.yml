name: Deploy to S3
on:
  push:
    branches:
      - master
    paths:
      - .github
      - src/**
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUCKET: korabo-frontend-975050100357
      CF_ID: EJAOUKQGDB3RC
      AWS_REGION: ap-southeast-1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-region: ap-southeast-1
          role-session-name: S3DeploymentSession
          role-to-assume: arn:aws:iam::975050100357:role/korabo_s3_deploy

      - name: Deploy to S3
        run: |
          aws s3 sync dist/korabo-frontend/browser/ s3://$BUCKET/ \
            --cache-control "max-age=31536000,public,immutable" \
            --exclude "index.html" \
            --delete
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/korabo-frontend/browser/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_ID \
            --paths "/*"

